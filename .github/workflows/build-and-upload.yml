name: Build and Upload PDFs

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build PDFs
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in */*.tex; do latexmk -pdf -cd -outdir=build "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: build-folder
          path: ./**/build
          if-no-files-found: error
          retention-days: 1

  upload:
    name: Upload PDFs
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-folder
          path: build
      - run: ls -l build
