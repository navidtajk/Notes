name: Build and Upload PDFs

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build PDFs
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v6
      - run: for f in */*.tex; do latexmk -pdf -cd -outdir=build "$f"; done
  - uses: actions/upload-artifact@v7
    with:
      name: build-folder
      path: build
      if-no-files-found: error
      retention-days: 1

  upload:
    name: Upload PDFs
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v8
      with:
        path: build
        pattern: build-folder
    - run: ls -l build
